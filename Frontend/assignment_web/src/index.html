<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 เมฆ — Task Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===========================
       Sidebar
       =========================== -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="sidebar-brand-text">5 เมฆา</span>
    </div>

    <div class="sidebar-section">วิชาของฉัน</div>
    <div class="sbi active" onclick="filterCourse('all', this)"><div class="sbi-dot"></div>All Task</div>
    <div class="sbi" onclick="filterCourse('CS232', this)"><div class="sbi-dot"></div>CS 232</div>
    <div class="sbi" onclick="filterCourse('CS251', this)"><div class="sbi-dot"></div>CS 251</div>
    <div class="sbi" onclick="filterCourse('CS222', this)"><div class="sbi-dot"></div>CS 222</div>
    <div class="sbi" onclick="filterCourse('CS271', this)"><div class="sbi-dot"></div>CS 271</div>
    <div class="sbi" onclick="filterCourse('CS242', this)"><div class="sbi-dot"></div>CS 242</div>
    <div class="sbi" onclick="filterCourse('CS217', this)"><div class="sbi-dot"></div>CS 217</div>
    <div class="sbi" onclick="filterCourse('EL395', this)"><div class="sbi-dot"></div>EL 395</div>

    <div class="sidebar-spacer"></div>
    <div class="sidebar-logout">
      <div class="logout-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        log out
      </div>
    </div>
  </div>

  <!-- ===========================
       Main Area
       =========================== -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">All Task assignment</span>
      <div class="topbar-user">
        <div class="topbar-name">
          <strong>Krisanapol</strong>
          Bunrueang
        </div>
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- ===========================
           Task List Page
           =========================== -->
      <div class="page active" id="page-list">

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-num done" id="stat-done">23</div>
            <div class="stat-label">ส่งแล้ว</div>
          </div>
          <div class="stat-card">
            <div class="stat-num pending" id="stat-pending">15</div>
            <div class="stat-label">ยังไม่ส่ง</div>
          </div>
          <div class="stat-card">
            <div class="stat-num late" id="stat-late">3</div>
            <div class="stat-label">ส่งล่าช้า</div>
          </div>
        </div>

        <!-- Active task list -->
        <div id="task-list"></div>

        <!-- Completed toggle -->
        <button class="completed-toggle" onclick="toggleCompleted()">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          Completed tasks
          <span id="comp-arrow" style="margin-left: auto;">&#9660;</span>
        </button>
        <div id="completed-list" style="display: none;"></div>

      </div>

      <!-- ===========================
           Task Detail Page
           =========================== -->
      <div class="page" id="page-detail">

        <button class="back-btn" onclick="showList()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          กลับ
        </button>

        <div class="detail-card">
          <div class="detail-title" id="d-title"></div>
          <div class="detail-meta">
            <span class="detail-course-badge" id="d-course"></span>
            <span class="detail-due" id="d-due"></span>
            <span class="badge" id="d-badge"></span>
          </div>
          <div class="detail-desc-label">คำอธิบาย</div>
          <div class="detail-desc" id="d-desc"></div>
          <div class="readonly-notice">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            สถานะ sync มาจาก Microsoft Teams — ไม่สามารถส่งงานในระบบนี้ได้
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
