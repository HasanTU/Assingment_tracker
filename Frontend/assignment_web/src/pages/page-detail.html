<!-- ===========================
     pages/page-detail.html
     หน้าแสดงรายละเอียด task
     frontend แก้ UI ตรงนี้ได้เลยโดยไม่แตะ index.html
     =========================== -->
<div class="page" id="page-detail">

  <button class="back-btn" onclick="showList()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    กลับ
  </button>

  <div class="detail-card">
    <!-- ชื่องาน (inject โดย script.js) -->
    <div class="detail-title" id="d-title"></div>

    <!-- meta: วิชา, due date, สถานะ -->
    <div class="detail-meta">
      <span class="detail-course-badge" id="d-course"></span>
      <span class="detail-due" id="d-due"></span>
      <span class="badge" id="d-badge"></span>
    </div>

    <!-- คำอธิบายงาน -->
    <div class="detail-desc-label">คำอธิบาย</div>
    <div class="detail-desc" id="d-desc"></div>

    <!-- หมายเหตุ: ดูได้อย่างเดียว -->
    <div class="readonly-notice">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      สถานะ sync มาจาก Microsoft Teams — ไม่สามารถส่งงานในระบบนี้ได้
    </div>
  </div>

</div>
