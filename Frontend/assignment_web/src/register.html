<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 เมฆา — สมัครสมาชิก</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-bg">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="auth-logo-text">5 เมฆา</span>
    </div>

    <h2 class="auth-title">สมัครสมาชิก</h2>
    <p class="auth-subtitle">สร้างบัญชีเพื่อเริ่มใช้งานระบบ</p>

    <!-- Form -->
    <div class="auth-form">
      <div class="auth-form-row">
        <div class="form-group">
          <label class="form-label">ชื่อ</label>
          <input class="form-input" type="text" id="reg-firstname" placeholder="ชื่อจริง">
        </div>
        <div class="form-group">
          <label class="form-label">นามสกุล</label>
          <input class="form-input" type="text" id="reg-lastname" placeholder="นามสกุล">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">อีเมล</label>
        <input class="form-input" type="email" id="reg-email" placeholder="example@university.ac.th">
      </div>
      <div class="form-group">
        <label class="form-label">รหัสผ่าน</label>
        <input class="form-input" type="password" id="reg-password" placeholder="อย่างน้อย 8 ตัวอักษร">
      </div>
      <div class="form-group">
        <label class="form-label">ยืนยันรหัสผ่าน</label>
        <input class="form-input" type="password" id="reg-confirm" placeholder="••••••••">
      </div>

      <!-- Error message -->
      <div class="auth-error" id="reg-error" style="display:none;"></div>

      <button class="auth-btn" onclick="handleRegister()">ยืนยัน</button>
    </div>

    <div class="auth-footer">
      มีบัญชีอยู่แล้ว?
      <a href="login.html" class="auth-link">เข้าสู่ระบบ</a>
    </div>

  </div>
</div>

<script>
function handleRegister() {
  var firstname = document.getElementById('reg-firstname').value.trim();
  var lastname  = document.getElementById('reg-lastname').value.trim();
  var email     = document.getElementById('reg-email').value.trim();
  var password  = document.getElementById('reg-password').value;
  var confirm   = document.getElementById('reg-confirm').value;
  var errorEl   = document.getElementById('reg-error');

  // Validation
  if (!firstname || !lastname || !email || !password || !confirm) {
    errorEl.textContent = 'กรุณากรอกข้อมูลให้ครบทุกช่อง';
    errorEl.style.display = 'block';
    return;
  }

  if (password.length < 8) {
    errorEl.textContent = 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';
    errorEl.style.display = 'block';
    return;
  }

  if (password !== confirm) {
    errorEl.textContent = 'รหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง';
    errorEl.style.display = 'block';
    return;
  }

  // ตรงนี้ backend เชื่อม API ได้เลย
  errorEl.style.display = 'none';
  sessionStorage.setItem('isLoggedIn', 'true');
  window.location.href = 'index.html';
}

// กด Enter เพื่อ register ได้เลย
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleRegister();
});
</script>

</body>
</html>
